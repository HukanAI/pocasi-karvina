<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ikona vyplněná až do krajů (tvar ořízne systém). Obsah leží v bezpečné zóně: kruh r = 205 kolem středu. -->
  <defs><clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0f3b7a"/>
      <stop offset="0.55" stop-color="#2f74c9"/>
      <stop offset="1" stop-color="#6fb4f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.66" cy="0.36" r="0.42">
      <stop offset="0" stop-color="#fff6dc" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#ffcb4d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#08264f" flood-opacity="0.35"/>
    </filter>
  </defs><g clip-path="url(#r)">
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <circle cx="318" cy="206" r="74" fill="url(#sun)"/>
  <path filter="url(#shadow)" fill="url(#cloud)"
        d="M168 352h178c37 0 66-28 66-63 0-34-27-61-61-63-9-45-48-78-95-78-41 0-76 25-90 61-38 3-67 33-67 71 0 40 31 72 69 72Z"/>
</g></svg>
