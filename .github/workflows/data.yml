# Každou hodinu: měření ČHMÚ, výstrahy, upozornění (ntfy); jednou denně klimatické řady.
# Výsledky se ukládají do větve `data` (jediný commit, přepisuje se – historie neroste).
name: Aktualizace dat

on:
  schedule:
    # ČHMÚ zveřejňuje 10min data kolem :03, proto běh v :12
    - cron: '12 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Znovu stáhnout celé historické řady (ČHMÚ od 1877, ERA5 od 1940)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_DIR: ${{ github.workspace }}/data-branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Načtení větve data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-branch
          else
            echo "Větev data zatím neexistuje, vytvořím ji."
            mkdir -p data-branch
          fi

      - name: Měření ČHMÚ Karviná
        continue-on-error: true
        run: node scripts/update-station.ts

      - name: Výstrahy
        continue-on-error: true
        run: node scripts/fetch-warnings.ts

      - name: Klimatické řady (jednou denně nebo na vyžádání)
        continue-on-error: true
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            node scripts/update-climate.ts --full
          elif [ "$(date -u +%H)" = "03" ] || [ ! -f data-branch/station-daily.json ] || [ ! -f data-branch/era5-daily.json ]; then
            node scripts/update-climate.ts
          else
            echo "Přeskočeno (běží denně ve 3 h UTC)."
          fi

      - name: Upozornění (ntfy)
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "Secret NTFY_TOPIC není nastaven – jen kontrola bez odeslání."
            node scripts/check-alerts.ts --dry-run
          else
            node scripts/check-alerts.ts
          fi

      - name: Uložení do větve data
        working-directory: data-branch
        run: |
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Data $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          ls -la

      - name: Udržení plánovače v chodu (1. den v měsíci)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub vypíná plánované workflow po 60 dnech bez aktivity; opětovné povolení odpočet resetuje
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "03" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/data.yml/enable" && echo "Plánovač obnoven."
          fi
