# Každých 10 minut: měření ČHMÚ, výstrahy, upozornění (ntfy); jednou denně klimatické řady.
# Výsledky se ukládají do větve `data` (jediný commit, přepisuje se – historie neroste).
name: Aktualizace dat

on:
  schedule:
    # Hlavní spouštění zajišťuje externí služba cron-job.org (workflow_dispatch každých 10 min, viz README),
    # protože plánovač GitHubu běhy vynechává (ověřeno: 1 z 9 hodinových běhů, 0 z 3 desetiminutových).
    # Vlastní plán zůstává jako záloha. Skripty jsou idempotentní, souběžné spuštění hlídá `concurrency`.
    - cron: '2-59/10 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Znovu stáhnout celé historické řady (ČHMÚ od 1877, ERA5 od 1940)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_DIR: ${{ github.workspace }}/data-branch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Načtení větve data
        run: |
          # Exit kód 2 = větev neexistuje; jiná chyba (síť) musí běh zastavit, jinak by se větev přepsala prázdnými daty
          set +e
          git ls-remote --exit-code --heads origin data >/dev/null
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-branch
          elif [ "$code" = "2" ]; then
            echo "Větev data zatím neexistuje, vytvořím ji."
            mkdir -p data-branch
          else
            echo "::error::Nelze ověřit větev data (kód $code)"
            exit 1
          fi

      - name: Měření ČHMÚ Karviná
        continue-on-error: true
        run: node scripts/update-station.ts

      - name: Výstrahy
        continue-on-error: true
        run: node scripts/fetch-warnings.ts

      - name: Klimatické řady (když jsou starší než 20 h nebo na vyžádání)
        continue-on-error: true
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            node scripts/update-climate.ts --full
          else
            node scripts/update-climate.ts --if-stale
          fi

      - name: Upozornění (ntfy)
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "Secret NTFY_TOPIC není nastaven – jen kontrola bez odeslání."
            node scripts/check-alerts.ts --dry-run
          else
            node scripts/check-alerts.ts
          fi

      - name: Uložení do větve data
        working-directory: data-branch
        run: |
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Data $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          ls -la

      - name: Udržení workflow v chodu
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub vypíná plánované workflow po 60 dnech bez aktivity a vypnuté nejde spustit ani zvenku.
        # Opětovné povolení odpočet resetuje; volá se při každém běhu (plánovaném i externím).
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/data.yml/enable" && echo "Plánovač obnoven."
