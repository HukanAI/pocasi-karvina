# Každých 10 minut: měření ČHMÚ, výstrahy, upozornění (ntfy); jednou denně klimatické řady.
# Výsledky se ukládají do větve `data` (jediný commit, přepisuje se – historie neroste).
name: Aktualizace dat

on:
  schedule:
    # Hlavní spouštění zajišťuje externí služba cron-job.org (workflow_dispatch každých 10 min, viz README),
    # protože plánovač GitHubu běhy vynechává (ověřeno: 1 z 9 hodinových běhů, 0 z 3 desetiminutových).
    # Vlastní plán zůstává jako záloha. Skripty jsou idempotentní, souběžné spuštění hlídá `concurrency`.
    - cron: '2-59/10 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Znovu stáhnout celé historické řady (ČHMÚ od 1877, ERA5 od 1940)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_DIR: ${{ github.workspace }}/data-branch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Načtení větve data
        run: |
          # Exit kód 2 = větev neexistuje. Jiná chyba (síť, výpadek GitHubu) se zkusí znovu; když GitHub
          # zůstane nedostupný, zbytek běhu se přeskočí (nesmí se zapsat prázdná data přes existující větev)
          # a běh skončí jen varováním – další běh za 10 minut vše dožene a zbytečně nechodí e-mail o chybě.
          for attempt in 1 2 3 4; do
            set +e
            git ls-remote --exit-code --heads origin data >/dev/null
            code=$?
            if [ "$code" = "0" ]; then
              rm -rf data-branch
              git clone -q --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-branch && exit 0
              code=clone
            fi
            set -e
            if [ "$code" = "2" ]; then
              echo "Větev data zatím neexistuje, vytvořím ji."
              mkdir -p data-branch
              exit 0
            fi
            echo "Pokus $attempt: větev data nelze načíst (kód $code)"
            [ "$attempt" = "4" ] || sleep $((attempt * 15))
          done
          echo "::warning::GitHub je nedostupný, větev data nelze načíst – běh se přeskočí, další ho dožene."
          echo "SKIP=1" >> "$GITHUB_ENV"

      - name: Měření ČHMÚ Karviná
        if: env.SKIP != '1'
        continue-on-error: true
        run: node scripts/update-station.ts

      - name: Výstrahy
        if: env.SKIP != '1'
        continue-on-error: true
        run: node scripts/fetch-warnings.ts

      - name: Radar a předpověď srážek ČHMÚ (radar, nowcasting, model ALADIN)
        if: env.SKIP != '1'
        continue-on-error: true
        run: node scripts/update-radar.ts

      - name: Klimatické řady (když jsou starší než 20 h nebo na vyžádání)
        if: env.SKIP != '1'
        continue-on-error: true
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            node scripts/update-climate.ts --full
          else
            node scripts/update-climate.ts --if-stale
          fi

      - name: Upozornění (ntfy)
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "Secret NTFY_TOPIC není nastaven – jen kontrola bez odeslání."
            node scripts/check-alerts.ts --dry-run
          else
            node scripts/check-alerts.ts
          fi

      - name: Uložení do větve data
        if: env.SKIP != '1'
        working-directory: data-branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Jediný commit, který se přepisuje (historie neroste). Při existující větvi „amend“ –
          # git pak odešle jen změněné soubory, ne celých několik MB dat při každém běhu.
          if [ -d .git ]; then
            git add -A
            git commit -q --amend --no-edit --date=now -m "Data $(date -u +'%Y-%m-%d %H:%M') UTC"
          else
            git init -q -b data
            git add -A
            git commit -q -m "Data $(date -u +'%Y-%m-%d %H:%M') UTC"
          fi
          # GitHub občas vrátí „Internal Server Error“ (krátké výpadky) → několik pokusů s rostoucí pauzou
          for attempt in 1 2 3 4; do
            if out=$(git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:data 2>&1); then
              echo "Uloženo (pokus $attempt)."
              exit 0
            fi
            echo "Pokus $attempt selhal: $out"
            [ "$attempt" = "4" ] || sleep $((attempt * 15))
          done
          # Výpadek na straně GitHubu: jen varování, data uloží další běh. Jiná chyba (oprávnění…) běh shodí.
          if echo "$out" | grep -qiE "internal server error|50[0-9]|timed out|could not resolve|connection (reset|refused)|unable to access"; then
            echo "::warning::GitHub data nepřijal (výpadek na jeho straně), uloží je další běh."
            exit 0
          fi
          echo "::error::Uložení do větve data selhalo."
          exit 1

      - name: Udržení workflow v chodu
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub vypíná plánované workflow po 60 dnech bez aktivity a vypnuté nejde spustit ani zvenku.
        # Opětovné povolení odpočet resetuje; volá se při každém běhu (plánovaném i externím).
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/data.yml/enable" && echo "Plánovač obnoven."
